name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]   # node --test with glob patterns needs 22+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test            # unit tests, bundling, build determinism, validation, deploy against the mock API, typecheck
      - run: npm run validate    # the example workflows build for every environment and pass every rule
